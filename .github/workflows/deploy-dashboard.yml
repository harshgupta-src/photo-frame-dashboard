# Builds the dashboard and deploys it, together with the frame-data Worker that serves it, on every
# push to main that touches dashboard/. The frame picks the new build up by itself within ~5 min.
# The Worker runs on the Azure VM (dashboard/worker/vm/README.md): this deploys there over SSH. The
# Cloudflare Worker is a proxy to it and isn't touched (npm run deploy:proxy / deploy:cloudflare).
#
# Runs only where the repository variable DEPLOY_DASHBOARD is "true", so forks don't try to deploy.
# Secrets:
#   FRAME_DATA_SSH_KEY     private key of the VM's framedeploy user (may only release and restart frame-data)
#   FRAME_DATA_KNOWN_HOSTS the VM's SSH host key line (ssh-keyscan -t ed25519 <host>, checked against the VM)
#   DASHBOARD_ENV          the contents of dashboard/.env.local (see dashboard/.env.example)
# Worker secrets (iCloud login, READ_KEY, CALENDARS, ...) stay on the VM (/etc/frame-data/secrets.env)
# and are kept by deploys; non-VITE_ entries of DASHBOARD_ENV add to or override them.
name: Deploy dashboard

on:
  push:
    branches: [main]
    paths: ['dashboard/**', '.github/workflows/deploy-dashboard.yml']
  workflow_dispatch:

concurrency:
  group: deploy-dashboard
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: vars.DEPLOY_DASHBOARD == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Test the Worker
        run: node --test worker/test/photos.test.js worker/test/ics.test.js
      - name: Write .env.local
        env:
          DASHBOARD_ENV: ${{ secrets.DASHBOARD_ENV }}
        run: printf '%s\n' "$DASHBOARD_ENV" > .env.local
      - name: SSH key for the VM
        env:
          FRAME_DATA_SSH_KEY: ${{ secrets.FRAME_DATA_SSH_KEY }}
          FRAME_DATA_KNOWN_HOSTS: ${{ secrets.FRAME_DATA_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$FRAME_DATA_SSH_KEY" > ~/.ssh/frame_deploy && chmod 600 ~/.ssh/frame_deploy
          printf '%s\n' "$FRAME_DATA_KNOWN_HOSTS" >> ~/.ssh/known_hosts
      - name: Build and deploy
        run: FRAME_DATA_SSH_KEY="$HOME/.ssh/frame_deploy" npm run deploy
