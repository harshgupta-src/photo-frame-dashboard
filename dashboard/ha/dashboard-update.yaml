# Home Assistant automation: a dashboard deploy → every frame, over MQTT.
# `npm run deploy` (worker/scripts/deploy.mjs) POSTs {"build": "<asset key>"} to this webhook when
# HA_DEPLOY_WEBHOOK_URL is in .env.local. The kiosk subscribes to homehq/dashboard/update and calls
# the page's window.frameUpdate(build), which checks the Worker and applies the new build once the
# frame is idle, behind an "Updating…" screen (js/app.js). Retained, so a frame that was offline
# gets it when it reconnects; a frame already on that build ignores it.
# Install: see ha/README.md ("Dashboard deploys").
- id: frame_dashboard_update
  alias: Photo frame dashboard deployed
  description: Tells the photo frames a new dashboard build is live (homehq/dashboard/update).
  mode: queued
  max: 3
  triggers:
    - trigger: webhook
      webhook_id: WEBHOOK_ID
      allowed_methods: [POST]
      local_only: false
  actions:
    - action: mqtt.publish
      data:
        topic: homehq/dashboard/update
        payload: "{{ (trigger.json.build if trigger.json is mapping and trigger.json.build is string else '') | truncate(1000, true, '') }}"
        retain: true
