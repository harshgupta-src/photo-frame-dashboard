# Add to Home Assistant's /config/configuration.yaml (and the two secrets to secrets.yaml):
#   frame_read_key: the frame-data Worker's READ_KEY
#   frame_reminders_webhook: http://127.0.0.1:8123/api/webhook/<webhook id of reminders-sync.yaml>
rest_command:
  frame_worker_reminders:
    url: https://frame-data.<your-subdomain>.workers.dev/reminders
    method: GET
    headers:
      X-Frame-Key: !secret frame_read_key
    timeout: 20
  frame_reminders_sync:
    url: !secret frame_reminders_webhook
    method: POST
    content_type: application/json
    payload: "{{ lists | tojson }}"

input_text:
  frame_reminders_updated:
    name: Reminders last pushed
    max: 64
