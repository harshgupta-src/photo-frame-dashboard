# Maya's walk plan. Copy to /config/packages/walk_plan.yaml (needs walk_house.yaml's secrets).
#
# At 04:30 HA plans the day, and after every walk is logged (or edited or deleted), or a calendar event
# changes (sensor.maya_calendar_watch, polled every 5 min), it replans the rest of the day: it gathers the calendars, the last 14 days of walks with Maya's pee/poop rhythm (gaps
# between them, time since the last ones), the hourly forecast and Maya's vault note, asks the HA
# Copilot Agent for the walks as JSON, and PUTs the plan to the Worker (PUT /walks/plan/<date>). A
# replan keeps the walks already done (or due) and replaces only the ones still ahead. The Worker
# writes each planned walk to its walkers' calendar, moves or removes events when the plan changes,
# and removes a walk's event once it is logged. The frame shows the next one. 15 min before each
# planned walk, its walkers get a heads-up on their phones (sensor.maya_walk_plan caches the plan).
#
# Meals: the same agent call also places Maya's meals still to come that day (GET /meals: the meal events
# on the calendars, with their usual times). It keeps each at its usual time unless nobody who could feed
# her is free, and picks who feeds from availability; PUT /meals/plan/<date> moves the events and puts
# them in the feeder's calendar. Once a meal is fed, maya_meal.yaml has the Worker move it to Life Log.

rest_command:
  frame_walk_history:
    url: "https://frame-data.<your-subdomain>.workers.dev/walks?days=14"
    method: GET
    headers:
      Authorization: !secret frame_walk_auth
    timeout: 15
  frame_walk_plan_get:
    url: "https://frame-data.<your-subdomain>.workers.dev/walks/plan?date={{ date }}"
    method: GET
    headers:
      Authorization: !secret frame_walk_auth
    timeout: 15
  frame_walk_plan_put:
    url: "https://frame-data.<your-subdomain>.workers.dev/walks/plan/{{ date }}"
    method: PUT
    headers:
      Authorization: !secret frame_walk_auth
    content_type: application/json
    payload: "{{ body | tojson }}"
    timeout: 30
  # Maya's meals (worker/src/meals.js): the day's meal events, moving/reassigning them, and moving a fed
  # meal to the Life Log calendar (and back on undo). maya_meal.yaml calls the last two.
  frame_meals_get:
    url: "https://frame-data.<your-subdomain>.workers.dev/meals?date={{ date }}"
    method: GET
    headers:
      Authorization: !secret frame_walk_auth
    timeout: 30
  frame_meals_plan_put:
    url: "https://frame-data.<your-subdomain>.workers.dev/meals/plan/{{ date }}"
    method: PUT
    headers:
      Authorization: !secret frame_walk_auth
    content_type: application/json
    payload: "{{ body | tojson }}"
    timeout: 60
  frame_meal_log:
    url: "https://frame-data.<your-subdomain>.workers.dev/meals/log"
    method: POST
    headers:
      Authorization: !secret frame_walk_auth
    content_type: application/json
    payload: "{{ body | tojson }}"
    timeout: 60
  frame_meal_unlog:
    url: "https://frame-data.<your-subdomain>.workers.dev/meals/log/{{ id }}"
    method: DELETE
    headers:
      Authorization: !secret frame_walk_auth
    timeout: 60

template:
  # Today's plan, cached for the 15-min heads-up. Refreshed every 10 min, when a walk is logged and
  # when the planner writes a plan. On an error it keeps the last good plan.
  - triggers:
      - trigger: time_pattern
        minutes: "/10"
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: maya_walk_plan_updated
      - trigger: event
        event_type: maya_walk_logged
    actions:
      - action: rest_command.frame_walk_plan_get
        data:
          date: "{{ now().date().isoformat() }}"
        response_variable: plan
        continue_on_error: true
    sensor:
      - name: Maya walk plan
        unique_id: maya_walk_plan_cache
        icon: mdi:calendar-clock
        state: >-
          {{ 'ok' if plan is defined and plan.status == 200 and plan.content is mapping else 'error' }}
        attributes:
          date: >-
            {{ plan.content.date if plan is defined and plan.status == 200 and plan.content is mapping and plan.content.date is defined
               else this.attributes.date | default(none) }}
          walks: >-
            {%- if plan is defined and plan.status == 200 and plan.content is mapping -%}
              {%- set ns = namespace(out=[]) -%}
              {%- for x in plan.content.walks | default([]) -%}
                {%- set ns.out = ns.out + [{'id': x.id, 'start': x.start, 'durationMin': x.durationMin, 'walkers': x.walkers,
                     'walkerIds': x.walkerIds, 'note': x.note | default(none), 'status': x.status}] -%}
              {%- endfor -%}
              {{ ns.out }}
            {%- else -%}
              {{ this.attributes.walks | default([]) }}
            {%- endif -%}

  # Everyone's calendar events from now to the end of tomorrow (except Maya's own: the planner's 🐕 walks and
  # her meals, which the planner moves itself), for
  # maya_walk_plan_on_calendar_change. Polled every 5 min, so it sees events added anywhere (Apple Calendar,
  # HA, agents); refreshed sooner after HA itself writes a calendar. On an error it keeps the last list.
  - triggers:
      - trigger: time_pattern
        minutes: "/5"
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: maya_calendar_refresh
    actions:
      - action: calendar.get_events
        target:
          entity_id:
            - calendar.harshs_calendar
            - calendar.ambujas_calendar
            - calendar.a_h_life
        data:
          start_date_time: "{{ now().isoformat() }}"
          end_date_time: "{{ (today_at() + timedelta(days=2)).isoformat() }}"
        response_variable: cal
        continue_on_error: true
    sensor:
      - name: Maya calendar watch
        unique_id: maya_calendar_watch
        icon: mdi:calendar-search
        state: "{{ 'ok' if cal is defined else 'calendar error' }}"
        attributes:
          events: >-
            {%- if cal is not defined -%}
              {{ this.attributes.events | default([]) }}
            {%- else -%}
              {%- set ns = namespace(out=[]) -%}
              {%- for ent, v in cal.items() -%}
                {%- for e in v.events if not (e.summary | default('')).startswith('🐕') and not ((e.summary | default('')) | lower) is match('maya\\b') -%}
                  {%- set ns.out = ns.out + [{'c': ent.split('.')[1], 's': e.start, 'e': e.end, 't': (e.summary | default(''))[:80]}] -%}
                {%- endfor -%}
              {%- endfor -%}
              {{ ns.out | sort(attribute='s') }}
            {%- endif -%}

shell_command:
  maya_walk_note: "head -c 8000 '/share/obsidian/harsh-memory/Areas/People/Maya.md'"

script:
  maya_walk_plan:
    alias: "Maya walk: plan the day"
    description: >-
      Ask the Copilot Agent for the day's walks (times, lengths, walkers) from Maya's pee/poop rhythm and
      both calendars, and send them to the frame. replan keeps what's done and replaces what's ahead.
    mode: queued
    max: 5
    fields:
      date:
        description: "YYYY-MM-DD (default today)"
        example: "2026-11-20"
      replan:
        description: Only replan the walks still ahead (after a walk is logged or a calendar changes)
        selector:
          boolean:
      reason:
        description: Why a replan is needed (shown to the agent)
        example: "a walk was just logged"
    variables:
      day: "{{ date if date is defined and date else now().date().isoformat() }}"
      rest: "{{ replan | default(false) | bool and day == now().date().isoformat() }}"
      calendars:
        calendar.harshs_calendar: "Harsh's calendar (Harsh only)"
        calendar.ambujas_calendar: "Ambuja's calendar (Ambuja only)"
        calendar.a_h_life: "A&H Life (shared, both)"
      start_ts: "{{ as_timestamp(strptime(day ~ ' 00:00', '%Y-%m-%d %H:%M').replace(tzinfo=now().tzinfo)) }}"
      # Replanned walks start at least this far ahead.
      from_ts: "{{ [start_ts, now().timestamp() + 15 * 60] | max if rest else start_ts }}"
    sequence:
      - action: calendar.get_events
        target:
          entity_id: "{{ calendars.keys() | list }}"
        data:
          start_date_time: "{{ (start_ts - 4 * 3600) | timestamp_local }}"
          end_date_time: "{{ (start_ts + 28 * 3600) | timestamp_local }}"
        response_variable: cal
        continue_on_error: true
      - action: weather.get_forecasts
        target:
          entity_id: weather.forecast_home
        data:
          type: hourly
        response_variable: wx
        continue_on_error: true
      - action: rest_command.frame_walk_history
        response_variable: hist
        continue_on_error: true
      - action: rest_command.frame_walk_plan_get
        data:
          date: "{{ day }}"
        response_variable: cur
        continue_on_error: true
      - action: shell_command.maya_walk_note
        response_variable: note
        continue_on_error: true
      - action: rest_command.frame_meals_get
        data:
          date: "{{ day }}"
        response_variable: mealres
        continue_on_error: true
      - action: rest_command.lifelog_maya_meals
        response_variable: fedres
        continue_on_error: true
      - variables:
          walks: >-
            {{ (hist.content.walks if hist is defined and hist.status == 200 and hist.content is mapping and hist.content.walks is defined else [])
               | selectattr('endedAt') | sort(attribute='startedAt') | list }}
          # Planned walks to keep on a replan: done, under way, or already started.
          kept: >-
            {%- set ns = namespace(out=[]) -%}
            {%- for x in (cur.content.walks if rest and cur is defined and cur.status == 200 and cur.content is mapping and cur.content.walks is defined else []) -%}
              {%- if x.status in ['done', 'active'] or as_timestamp(x.start) < from_ts -%}
                {%- set ns.out = ns.out + [{'id': x.id, 'start': x.start, 'end': x.end, 'walkers': x.walkerIds, 'note': x.note | default(none), 'status': x.status}] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.out }}
          # The rest of the current plan, which a replan may keep or change.
          ahead: >-
            {%- set ns = namespace(out=[]) -%}
            {%- for x in (cur.content.walks if cur is defined and cur.status == 200 and cur.content is mapping and cur.content.walks is defined else []) -%}
              {%- if x.status == 'planned' and as_timestamp(x.start) >= from_ts -%}
                {%- set ns.out = ns.out + ['- ' ~ as_local(as_datetime(x.start)).strftime('%H:%M') ~ ' ' ~ x.durationMin ~ ' min ' ~ (x.walkerIds | join(' & ')) ~ (' (' ~ x.note ~ ')' if x.note else '')] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.out }}
          # Maya's meals that day: fed ones (Lifelog) and the planned ones the agent may move or reassign
          # (not fed, and at least 10 min away).
          fed: >-
            {{ (fedres.content if fedres is defined and fedres.status == 200 and fedres.content is list else [])
               | selectattr('started_at') | list }}
          fed_ids: "{{ fed | map(attribute='id') | list }}"
          meals: >-
            {%- set ns = namespace(out=[]) -%}
            {%- for m in (mealres.content.meals if mealres is defined and mealres.status == 200 and mealres.content is mapping and mealres.content.meals is defined else []) -%}
              {%- if m.id not in fed_ids and as_timestamp(m.start) >= [start_ts, now().timestamp() + 600] | max -%}
                {%- set ns.out = ns.out + [{'kind': m.kind, 'start': as_local(as_datetime(m.start)).strftime('%H:%M'), 'usual': m.usual,
                     'people': m.people, 'cups': m.cups, 'title': m.title}] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.out }}
          meals_fed: >-
            {%- set ns = namespace(out=[]) -%}
            {%- for e in fed | sort(attribute='started_at') if (e.id | default('')).startswith('maya_meal-' ~ day) -%}
              {%- set ns.out = ns.out + ['- ' ~ (e.data.meal | default('meal')) ~ ' fed ' ~ as_local(as_datetime(e.started_at)).strftime('%H:%M') ~ ' by ' ~ (e.person or '?')] -%}
            {%- endfor -%}
            {{ ns.out }}
          # Pee/poop are logged at walk start + 1 min / + 3 min; gaps over 10 h (overnight) don't count for the daytime stats.
          potty: >-
            {%- set ns = namespace(lp=none, lo=none, rows=[], pg=[], og=[]) -%}
            {%- for w in walks -%}
              {%- set t = as_timestamp(w.startedAt) -%}
              {%- set txt = as_local(as_datetime(w.startedAt)).strftime('%a %m-%d %H:%M') ~ ' walk ' ~ (w.durationMin | default('?')) ~ ' min (' ~ (w.walkers | join(' & ')) ~ ')' -%}
              {%- if w.pee -%}
                {%- if ns.lp is not none -%}
                  {%- set g = ((t + 60 - ns.lp) / 60) | round(0) | int -%}
                  {%- set txt = txt ~ ' · pee ' ~ (g // 60) ~ 'h' ~ '%02d' | format(g % 60) ~ ' after the previous' -%}
                  {%- if g < 600 -%}{%- set ns.pg = ns.pg + [g] -%}{%- endif -%}
                {%- else -%}{%- set txt = txt ~ ' · pee' -%}{%- endif -%}
                {%- set ns.lp = t + 60 -%}
              {%- else -%}{%- set txt = txt ~ ' · no pee' -%}{%- endif -%}
              {%- if w.poop -%}
                {%- if ns.lo is not none -%}
                  {%- set g = ((t + 180 - ns.lo) / 60) | round(0) | int -%}
                  {%- set txt = txt ~ ' · poop ' ~ (g // 60) ~ 'h' ~ '%02d' | format(g % 60) ~ ' after the previous' -%}
                  {%- set ns.og = ns.og + [g] -%}
                {%- else -%}{%- set txt = txt ~ ' · poop' -%}{%- endif -%}
                {%- set ns.lo = t + 180 -%}
              {%- endif -%}
              {%- set ns.rows = ns.rows + [txt] -%}
            {%- endfor -%}
            {%- set pg = ns.pg | sort -%}{%- set og = ns.og | sort -%}
            {%- set hm = '%dh%02d' -%}
            {{ {'rows': ns.rows[-60:],
                'pee_gap': (hm % (pg[pg | count // 2] // 60, pg[pg | count // 2] % 60) ~ ' median, ' ~ hm % (pg | max // 60, pg | max % 60) ~ ' longest (daytime, over ' ~ pg | count ~ ' gaps)') if pg else 'unknown',
                'poop_gap': (hm % (og[og | count // 2] // 60, og[og | count // 2] % 60) ~ ' median, ' ~ hm % (og | min // 60, og | min % 60) ~ '–' ~ hm % (og | max // 60, og | max % 60) ~ ' range (' ~ og | count ~ ' gaps)') if og else 'unknown',
                'last_pee': (ns.lp | timestamp_custom('%a %H:%M') ~ ', ' ~ ((now().timestamp() - ns.lp) / 60) | round(0) | int ~ ' min ago') if ns.lp else 'unknown',
                'last_poop': (ns.lo | timestamp_custom('%a %H:%M') ~ ', ' ~ ((now().timestamp() - ns.lo) / 60) | round(0) | int ~ ' min ago') if ns.lo else 'unknown'} }}
          prompt: |-
            {%- set lines = namespace(cal=[], wx=[]) -%}
            {%- for ent, label in calendars.items() -%}
              {%- for e in (cal[ent].events if cal is defined and cal[ent] is defined else []) if not (e.summary | default('')).startswith('🐕') and not ((e.summary | default('')) | lower) is match('maya\\b') -%}
                {%- set lines.cal = lines.cal + ['- ' ~ label ~ ': ' ~ e.start ~ ' → ' ~ e.end ~ ' · ' ~ e.summary ~ (' @ ' ~ e.location if e.location else '')] -%}
              {%- endfor -%}
            {%- endfor -%}
            {%- for f in (wx['weather.forecast_home'].forecast if wx is defined and wx['weather.forecast_home'] is defined else []) if as_timestamp(f.datetime) < start_ts + 24 * 3600 and as_timestamp(f.datetime) >= from_ts - 3600 -%}
              {%- set lines.wx = lines.wx + ['- ' ~ as_local(as_datetime(f.datetime)).strftime('%H:%M') ~ ' ' ~ f.condition ~ ' ' ~ f.temperature ~ '°'
                  ~ (' feels ' ~ f.apparent_temperature ~ '°' if f.apparent_temperature is defined else '') ~ (' rain ' ~ f.precipitation_probability ~ '%' if f.precipitation_probability is defined else '')] -%}
            {%- endfor -%}
            You plan the dog walks{{ ' and meals' if meals else '' }} for {{ day }} ({{ strptime(day, '%Y-%m-%d').strftime('%A') }}) for Maya, Harsh and Ambuja's dog. Do not use any tools; everything you need is below.
            {% if rest %}
            It is now {{ now().strftime('%H:%M') }} and {{ reason if reason is defined and reason else 'a walk was just logged or edited' }}. Replan only the REST of the day: walks starting at or after {{ from_ts | timestamp_custom('%H:%M') }}. These planned walks are already done or under way and stay as they are:
            {%- for k in kept %}
            - {{ as_local(as_datetime(k.start)).strftime('%H:%M') }}–{{ as_local(as_datetime(k.end)).strftime('%H:%M') }} {{ k.walkers | join(' & ') }} ({{ k.status }}){% endfor %}
            {% elif reason is defined and reason %}
            This day's plan is being redone because {{ reason }}.
            {% endif %}
            {%- if ahead %}
            The current plan{{ ' for the rest of the day' if rest else '' }} is below. Keep a walk as it is (same time, length and walkers) unless Maya's rhythm or the calendars now call for a change; move only what needs to move:
            {{ ahead | join('\n') }}
            {% endif %}
            Maya only pees and poops on walks, so the walks must fit her bladder and bowel rhythm. Learn it from her history below and her note: how long she usually goes between pees and how long she can hold it at most (daytime and overnight), when she usually poops (e.g. after which meals and how long after), and how her meals and walk snack fall. Then:
            - Time each walk before she would need to go: no longer between pee walks than her usual daytime gap (never past her longest comfortable hold), and a poop opportunity around when she usually poops (counting from her last poop and her meals). Count from her last pee and poop below, not from the plan.
            - Only plan a walk when the chosen walkers are free: not in a calendar event and not travelling to or from one (allow ~30 min for anything away from home). Harsh's calendar blocks Harsh, Ambuja's blocks Ambuja, A&H Life blocks both. All-day events usually don't block unless they are travel or away from home. If her timing clashes with both people's commitments, move the walk just before the clash rather than after.
            - Keep her usual rhythm from the recent walks (times and lengths), avoid bad weather (heavy rain, extreme heat or cold) when a nearby slot works, and include a last walk before bed.
            - Prefer both walkers together when both are free and it suits the day; otherwise share the walks fairly.
            - Every walk lasts 5–180 minutes and starts on {{ day }} (local time, 24h){{ ' at or after ' ~ from_ts | timestamp_custom('%H:%M') if rest else '' }}.
            {%- if meals %}

            Maya's meals still to give {{ 'today' if day == now().date().isoformat() else 'that day' }} (kind · current time · usual time · who feeds now · amount):
            {%- for m in meals %}
            - {{ m.kind }} · {{ m.start }} · usual {{ m.usual }} · {{ m.people | join(' & ') }} · {{ m.cups ~ ' cup' if m.cups is not none else '?' }}{% endfor %}
            {%- if meals_fed %}
            Already fed today:
            {{ meals_fed | join('\n') }}
            {%- endif %}
            Plan these meals too:
            - Keep each meal at its usual time. Move one only when nobody who could feed her is free then, and then as little as possible (the nearest free slot, ideally within 30 min and never more than 90 min from the usual time), keeping at least ~3h between main meals (breakfast, lunch, dinner) and the order of the day.
            - Decide who feeds each meal from availability (same rules as the walks: a calendar event or travel blocks that person). Keep the current feeder(s) when they're free; if they aren't, give it to whoever is free. Use both only when it's on the shared calendar now and both are free.
            - The walk snack goes with the morning walk; fit walks to her meals (she often needs to poop some time after eating).
            - List every meal above in "meals", unchanged ones too, with the reason in "note" when one moves or changes hands.
            {%- endif %}

            Reply with ONLY this JSON, no prose or code fences{{ ' (only the walks still ahead; an empty list if none are needed)' if rest else '' }}:
            {"walks": [{"start": "HH:MM", "durationMin": 30, "walkers": ["harsh"], "note": "short reason, e.g. pee due ~3h after the 13:05 walk"}]{{ ', "meals": [{"kind": "lunch", "start": "HH:MM", "people": ["harsh"], "note": "only if moved or reassigned: why"}]' if meals else '' }}, "notes": "one line: Maya's rhythm as you understand it (pee every ~Xh, holds up to ~Yh, poops ~Z after meals) and the day's plan"}

            Maya now: last pee {{ potty.last_pee }}; last poop {{ potty.last_poop }}.
            Gaps between pees: {{ potty.pee_gap }}. Gaps between poops: {{ potty.poop_gap }}.

            Maya's note:
            {{ (note.stdout if note is defined and note.stdout is defined else '(unavailable)')[:8000] }}

            Walks of the last 14 days, oldest first, with pees and poops (times are the walk's start):
            {{ potty.rows | join('\n') if potty.rows else '- none' }}

            Calendar events (local times):
            {{ lines.cal | join('\n') if lines.cal else '- none' }}

            Hourly forecast:
            {{ lines.wx | join('\n') if lines.wx else '- unavailable' }}
      - action: ha_copilot_agent.submit
        data:
          prompt: "{{ prompt[:31000] }}"
          profile: home
        response_variable: job
      - wait_for_trigger:
          - trigger: event
            event_type: ha_copilot_agent_job_finished
            event_data:
              job_id: "{{ job.job_id }}"
        timeout: "00:15:00"
        continue_on_timeout: true
      - action: ha_copilot_agent.get_job
        data:
          job_id: "{{ job.job_id }}"
        response_variable: done
      - action: persistent_notification.dismiss
        data:
          notification_id: "ha_copilot_agent_{{ job.job_id }}"
      - variables:
          text: "{{ done.result if done.result is string else '' }}"
          plan: >-
            {%- set m = text | regex_findall('(?s)\\{.*\\}') -%}
            {{ (m | first) | from_json(default=none) if m else none }}
          ok: "{{ plan is mapping and plan.walks is defined and plan.walks is list }}"
          # The agent's walks that start in time (HH:MM today, else whatever the Worker accepts).
          fresh: >-
            {%- set ns = namespace(out=[]) -%}
            {%- for w in (plan.walks if ok else []) if w is mapping -%}
              {%- set s = w.start | default('') | string -%}
              {%- set ts = as_timestamp(strptime(day ~ ' ' ~ s, '%Y-%m-%d %H:%M', none).replace(tzinfo=now().tzinfo)) if strptime(day ~ ' ' ~ s, '%Y-%m-%d %H:%M', none) else none -%}
              {%- if ts is none or ts >= from_ts - 60 -%}
                {%- set ns.out = ns.out + [{'start': w.start, 'durationMin': w.durationMin | default(30), 'walkers': w.walkers | default([]), 'note': w.note | default(none)}] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.out }}
      - if:
          - condition: template
            value_template: "{{ ok }}"
        then:
          - action: rest_command.frame_walk_plan_put
            data:
              date: "{{ day }}"
              body:
                walks: "{{ kept + fresh }}"
                notes: "{{ plan.notes | default('') }}"
                source: "{{ 'ha-copilot-replan' if rest else 'ha-copilot' }}"
            response_variable: put
            continue_on_error: true
          # Meals: only the ones offered to the agent (not fed, not about to happen).
          - variables:
              meal_kinds: "{{ meals | map(attribute='kind') | list }}"
              meal_plan: >-
                {%- set ns = namespace(out=[]) -%}
                {%- for m in (plan.meals if plan.meals is defined and plan.meals is list else []) if m is mapping and (m.kind | default('') | lower | replace(' ', '-')) in meal_kinds -%}
                  {%- set ns.out = ns.out + [{'kind': m.kind | lower | replace(' ', '-'), 'start': m.start | default('') | string,
                       'people': ([m.people] if m.people is string else m.people | default([])), 'note': m.note | default(none)}] -%}
                {%- endfor -%}
                {{ ns.out }}
          - if:
              - condition: template
                value_template: "{{ meal_plan | count > 0 }}"
            then:
              - action: rest_command.frame_meals_plan_put
                data:
                  date: "{{ day }}"
                  body:
                    meals: "{{ meal_plan }}"
                    reason: "{{ reason if reason is defined and reason else ('replan' if rest else 'daily plan') }}"
                response_variable: mput
                continue_on_error: true
              - event: maya_meal_refresh_plan
      - variables:
          error: >-
            {%- if done.status != 'completed' -%}agent job {{ done.status }}{{ ': ' ~ done.error if done.error else '' }}
            {%- elif not ok -%}no plan JSON in the agent's reply
            {%- elif put is not defined -%}could not reach the frame Worker
            {%- elif put.status != 200 -%}Worker said {{ put.status }}: {{ put.content.error if put.content is mapping and put.content.error is defined else put.content }}
            {%- elif mput is defined and mput.status != 200 -%}meals: Worker said {{ mput.status }}: {{ mput.content.error if mput.content is mapping and mput.content.error is defined else mput.content }}
            {%- endif -%}
      - if:
          - condition: template
            value_template: "{{ error != '' }}"
        then:
          - variables:
              svc: "{% from 'home.jinja' import notify_service %}{{ notify_service('harsh') }}"
          - action: "{{ svc }}"
            data:
              title: "🐕 Maya's walk {{ 'replan' if rest else 'plan' }} failed"
              message: "{{ day }}: {{ error[:300] }}"
            continue_on_error: true
          - stop: "{{ error }}"
            error: true
        else:
          - event: maya_walk_plan_updated
            event_data:
              date: "{{ day }}"
          - action: logbook.log
            data:
              name: Maya walk plan
              message: >-
                {{ day }}{{ ' (replan)' if rest else '' }}: {% for w in fresh %}{{ w.start }} {{ w.durationMin }}m {{ w.walkers | join('+') }}{{ ', ' if not loop.last }}{% endfor %}{{ 'no more walks' if not fresh }}
                {%- if mput is defined and mput.content is mapping %} · meals: {% for c in mput.content.changed | default([]) %}{{ c.kind }} → {{ as_local(as_datetime(c.to)).strftime('%H:%M') }} {{ c.calendar }}{{ ', ' if not loop.last }}{% else %}unchanged{% endfor %}{% endif %} · {{ plan.notes | default('') }}

automation:
  - id: maya_walk_plan_daily
    alias: "Maya walk: plan each morning"
    description: Plan today's walks at 04:30.
    mode: single
    triggers:
      - trigger: time
        at: "04:30:00"
    actions:
      - action: script.turn_on
        target:
          entity_id: script.maya_walk_plan

  - id: maya_walk_plan_after_walk
    alias: "Maya walk: replan after a walk"
    description: >-
      When a walk of today is logged, edited or deleted (event from walk_house.yaml's webhook), wait 2 min
      for more edits, then replan the rest of the day around Maya's new last pee/poop.
    mode: restart
    triggers:
      - trigger: event
        event_type: maya_walk_logged
    conditions:
      - condition: template
        value_template: "{{ trigger.event.data.local_date == now().date().isoformat() }}"
    actions:
      - delay: "00:02:00"
      - action: script.turn_on
        target:
          entity_id: script.maya_walk_plan
        data:
          variables:
            replan: true

  - id: maya_walk_heads_up
    alias: "Maya walk: 15-min heads-up"
    description: >-
      15 min before each planned walk (not yet started), tell its walkers on their phones to get ready.
      Skipped if Maya is already out on a walk.
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/1"
    variables:
      due: >-
        {%- set ns = namespace(out=[]) -%}
        {%- for w in state_attr('sensor.maya_walk_plan', 'walks') or [] if w.status == 'planned' -%}
          {%- set ds = as_timestamp(w.start) - as_timestamp(now().replace(second=0, microsecond=0)) -%}
          {%- if 15 * 60 <= ds < 16 * 60 -%}{%- set ns.out = ns.out + [w] -%}{%- endif -%}
        {%- endfor -%}
        {{ ns.out }}
    conditions:
      - condition: template
        value_template: "{{ due | count > 0 and not is_state('sensor.maya_walk', 'out') }}"
    actions:
      - repeat:
          for_each: "{{ due }}"
          sequence:
            - variables:
                w: "{{ repeat.item }}"
                services: >-
                  {%- from 'home.jinja' import notify_service -%}
                  {%- set ns = namespace(s=[]) -%}
                  {%- for p in (w.walkerIds or ['harsh', 'ambuja']) -%}
                    {%- set svc = notify_service(p) -%}
                    {%- if svc and svc not in ns.s -%}{%- set ns.s = ns.s + [svc] -%}{%- endif -%}
                  {%- endfor -%}
                  {{ ns.s }}
            - repeat:
                for_each: "{{ services }}"
                sequence:
                  - action: "{{ repeat.item }}"
                    continue_on_error: true
                    data:
                      title: "🐕 Maya's walk in 15 min"
                      message: >-
                        {{ (as_datetime(w.start) | as_local).strftime('%-I:%M %p') }} · {{ w.durationMin }} min · {{ w.walkers | join(' & ') }}{{ ' · ' ~ w.note if w.note else '' }}
                      data:
                        tag: "maya_walk_heads_up-{{ w.id }}"
                        push:
                          interruption-level: time-sensitive

  - id: maya_walk_plan_on_calendar_change
    alias: "Maya walk: reassess when a calendar changes"
    description: >-
      When an upcoming event in Harsh's, Ambuja's or A&H Life calendar is added, moved, renamed or removed
      (sensor.maya_calendar_watch), ask the Copilot Agent to reassess that day's walks: the rest of today
      (from 04:30 on; earlier, the morning plan picks it up), or tomorrow if it already has a plan.
    mode: queued
    max: 5
    triggers:
      - trigger: state
        entity_id: sensor.maya_calendar_watch
        attribute: events
    variables:
      old: "{{ trigger.from_state.attributes.events if trigger.from_state and trigger.from_state.attributes.events is defined else none }}"
      new: "{{ trigger.to_state.attributes.events if trigger.to_state and trigger.to_state.attributes.events is defined else none }}"
      # Changes still ahead: events that are new or changed, and old ones gone before they ended.
      changes: >-
        {%- set ns = namespace(out=[]) -%}
        {%- if old is list and new is list -%}
          {%- set nowts = now().timestamp() -%}
          {%- for e in new if e not in old -%}{%- set ns.out = ns.out + [dict(e, op='added or changed')] -%}{%- endfor -%}
          {%- for e in old if e not in new and (e.e > now().date().isoformat() if e.e | length == 10 else as_timestamp(e.e, 0) > nowts) -%}{%- set ns.out = ns.out + [dict(e, op='removed or changed')] -%}{%- endfor -%}
        {%- endif -%}
        {{ ns.out }}
      dates: >-
        {%- set ns = namespace(d=[]) -%}
        {%- for e in changes if e.s[:10] not in ns.d -%}{%- set ns.d = ns.d + [e.s[:10]] -%}{%- endfor -%}
        {{ ns.d | sort }}
      reason: >-
        the calendars changed: {% for e in changes[:8] %}{{ e.op }} '{{ e.t }}' {{ e.s[:16] | replace('T', ' ') }}–{{ e.e[11:16] if 'T' in e.e else e.e }} ({{ e.c | replace('_', ' ') }}){{ '; ' if not loop.last }}{% endfor %}{{ ' and more' if changes | count > 8 }}
    conditions:
      - condition: template
        value_template: "{{ changes | count > 0 }}"
    actions:
      - action: logbook.log
        data:
          name: Maya walk plan
          message: "Calendar change for {{ dates | join(', ') }}: {{ reason[:400] }}"
      - repeat:
          for_each: "{{ dates }}"
          sequence:
            - variables:
                d: "{{ repeat.item }}"
                today: "{{ d == now().date().isoformat() }}"
            - if:
                - condition: template
                  value_template: "{{ today }}"
              then:
                - condition: template
                  value_template: "{{ now().hour * 60 + now().minute >= 4 * 60 + 30 }}"
                - action: script.turn_on
                  target:
                    entity_id: script.maya_walk_plan
                  data:
                    variables:
                      replan: true
                      reason: "{{ reason }}"
              else:
                - action: rest_command.frame_walk_plan_get
                  data:
                    date: "{{ d }}"
                  response_variable: fp
                  continue_on_error: true
                - condition: template
                  value_template: >-
                    {{ fp is defined and fp.status == 200 and fp.content is mapping and (fp.content.walks | default([]) | count) > 0 }}
                - action: script.turn_on
                  target:
                    entity_id: script.maya_walk_plan
                  data:
                    variables:
                      date: "{{ d }}"
                      reason: "{{ reason }}"

  - id: maya_calendar_refresh_after_ha_write
    alias: "Maya walk: recheck calendars after HA writes one"
    description: When HA creates or deletes a calendar event, recheck the calendars 30 s later instead of at the next 5-min poll.
    mode: restart
    triggers:
      - trigger: event
        event_type: call_service
        event_data:
          domain: calendar
    conditions:
      - condition: template
        value_template: "{{ trigger.event.data.service in ['create_event', 'delete_event', 'update_event'] }}"
    actions:
      - delay: "00:00:30"
      - event: maya_calendar_refresh
